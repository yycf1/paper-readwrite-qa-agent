[project]
name = "paper-agent"
version = "0.1.0"
description = "文献阅读复现 Agent：检索→下载→解析→实验知识提取→RAG问答"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "pymupdf>=1.24",
    "python-docx>=1.1",
]

[project.scripts]
pa = "paper_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_agent"]
