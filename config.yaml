# paper-agent 配置（M0 基线：主用硅基流动，备选智谱）
# 切换平台：改 base_url 和 model；API Key 一律放 .env，不写进本文件。

llm:
  base_url: https://api.siliconflow.cn/v1
  # 硅基流动按量计费模型；实测后可按性价比调整
  model: deepseek-ai/DeepSeek-V3
  api_key_env: LLM_API_KEY

embedding:
  base_url: https://api.siliconflow.cn/v1
  # BAAI/bge-m3：硅基流动免费档，中英多语，8K 上下文；智谱备选：embedding-3
  model: BAAI/bge-m3
  api_key_env: LLM_API_KEY

# 无人值守与下载预算（M1+ 使用）
pipeline:
  top_n: 5
  year_from: 2020
  download_budget: 10

data_dir: data
