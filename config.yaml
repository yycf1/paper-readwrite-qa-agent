# paper-agent 配置
# 切换 LLM 平台：改 base_url 和 model；API Key 一律放 .env，不写进本文件。

llm:
  # 智谱 OpenAI 兼容端点；GLM-4.7-Flash 为免费档（200K 上下文）
  base_url: https://open.bigmodel.cn/api/paas/v4
  model: GLM-4.7-Flash
  api_key_env: ZHIPU_API_KEY

embedding:
  # BAAI/bge-m3：硅基流动免费档，中英多语，8K 上下文
  base_url: https://api.siliconflow.cn/v1
  model: BAAI/bge-m3
  api_key_env: LLM_API_KEY

# 网络：访问被屏蔽的数据源（如 arXiv）时填本地代理，例如 http://127.0.0.1:7890；留空直连
proxy: ""

# 文献数据源（M1）：源不可达时自动降级跳过，不中断流水线
sources:
  openalex:
    enabled: true
    email: ""            # 选填：填邮箱进入 OpenAlex 礼貌池，限额更宽
  europepmc:
    enabled: true
  arxiv:
    enabled: true        # 无代理且被屏蔽时，搜索自动降级并在结果中标注

# 无人值守与下载预算（M4 使用）
pipeline:
  top_n: 5
  year_from: 2020
  download_budget: 10

data_dir: data
